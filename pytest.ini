[pytest]
# Единственный набор pytest в репозитории - стенд HIL. До этого файла настройки
# жили в командной строке, поэтому «каждый прогон» ничего не гарантировал: лог
# прогона 2026-09-27 шёл без -v и в нём нельзя было отличить тесты одного файла.
testpaths = Utils/hil

# -v - нодид на строку (файл::функция), -ra - причины пропусков,
# --durations=0 - сводка времени по фазам в конце.
addopts = -v -ra --durations=0

# Время каждого теста прямо по ходу прогона, а не сводкой в конце: вместе с -v
# pytest дописывает его в строку теста сам (_pytest/terminal.py, showlongtestinfo).
# Осторожно: с -s режим молча выключается, и время исчезает.
console_output_style = times

# Русские id параметров - как есть, а не \u0441\u0442... : весь набор и его
# сообщения на русском, и лог с escape-последовательностями нечитаем.
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
