# Стенд - такой же код, как прошивка, и гниёт так же. Правила выбраны те, что
# ловят поломки, а не оформление: порядок импортов, ловушки pytest, мёртвые
# переменные, упрощения.

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT", "RET", "C4"]
ignore = [
    "E501",     # длину строк держим глазами: в комментариях она не порок
    "PT011",    # pytest.raises(Exception) у нас всегда с match или своим типом
    "SIM105",   # contextlib.suppress прячет причину, а она в стенде нужна
    "PT018",    # составное утверждение с внятным текстом лучше двух безымянных
]

[lint.per-file-ignores]
# В селфтестах лезем во внутренности стенда намеренно: проверяем, что ушло в порт
"selftest/*" = ["SLF001"]
# Обрыв ловится на чтении, но отправка - часть того же разговора и остаётся рядом
"selftest/test_router.py" = ["SLF001", "PT012"]

[lint.flake8-pytest-style]
# Имена параметров у нас строкой через запятую - так набрано всё, что есть
parametrize-names-type = "csv"

[lint.isort]
known-first-party = ["hil"]
